<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive demo | ProTip365</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <aside class="flow" aria-label="User flow">
    <a class="brand" href="/" style="text-decoration:none">
      <svg class="logo" viewBox="0 0 48 48" aria-label="ProTip365"><rect width="48" height="48" rx="12" fill="#8A9C7D"/><text x="23" y="34" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="32" fill="#FBFAF6">p.</text></svg>
      <div>
        <div class="brand-name">protip<span style="font-weight:400">365</span></div>
        <div class="brand-sub">Interactive demo · ← back to home</div>
      </div>
    </a>
    <nav id="flowNav"></nav>
    <p class="hint">Tap anything in the phone. Logging a shift really updates the totals.</p>
  </aside>

  <main class="device-wrap">
    <div class="phone" id="phone">
      <div class="notch"></div>
      <div class="statusbar"><span>9:41</span><span class="sb-icons">●●● ▮</span></div>
      <div class="screen" id="screen"></div>
      <nav class="tabbar" id="tabbar">
        <button data-go="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Home</button>
        <button data-go="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
        <button class="tab-plus" data-go="log1" aria-label="Log a shift"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button data-go="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
        <button data-go="jobs"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Me</button>
      </nav>
    </div>
  </main>

  <aside class="notes" aria-live="polite">
    <div class="notes-step" id="notesStep"></div>
    <h2 id="notesTitle"></h2>
    <ul id="notesList"></ul>
    <div class="notes-next" id="notesNext"></div>
  </aside>
</div>
<script src="app.js"></script>
</body>
</html>
