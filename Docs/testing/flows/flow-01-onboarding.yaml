appId: com.defacto365.protip365
name: 01 Onboarding (fresh install)
---
- launchApp:
    clearState: true
- assertVisible: "Choose your language"
- tapOn: "English"
- tapOn: "Next"
- assertVisible: "Create your first employer"
- tapOn:
    below: "Employer name"
- inputText: "Test Bar"
- tapOn: "15.00"
- eraseText
- inputText: "15.50"
- tapOn: "Next"
- assertVisible: "Confirm your currency"
- tapOn: "Confirm and add a shift"
- assertVisible: "Add shift"
- takeScreenshot: onboarding-done
