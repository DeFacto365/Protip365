appId: com.defacto365.protip365
name: 02 Date picker opens without crash (KNOWN CRASH ZONE)
---
- launchApp
- tapOn: "Schedule"
- tapOn: "Add shift"
- assertVisible: "Date"
# Tap the date value field (e.g. "Jul 19, 2026") — this launches MaterialDatePicker
- tapOn: ".*, 20\\d\\d"
# If the app survived, a calendar dialog should be visible and the app still alive
- extendedWaitUntil:
    notVisible: "Date"
    timeout: 3000
    optional: true
- assertNotVisible: ".*keeps stopping.*"
- assertVisible: ".*20\\d\\d.*"
- takeScreenshot: datepicker-open
- tapOn: "Cancel"
- back
- assertVisible: "Schedule"
