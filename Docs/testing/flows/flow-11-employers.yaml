appId: com.defacto365.protip365
name: 11 Employer and role lifecycle
---
- launchApp
- runFlow:
    when:
      visible: "Unlock"
    commands:
      - tapOn: "6-digit passcode"
      - inputText: "123456"
      - tapOn: "Unlock"
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Manage employers"
- tapOn: "Manage employers"
- scrollUntilVisible:
    element:
      text: "＋ Add role"
- tapOn: "＋ Add role"
- scrollUntilVisible:
    element:
      text: "Role name"
- tapOn: "Role name"
- eraseText
- inputText: "Server"
- tapOn: "Hourly rate"
- eraseText
- inputText: "22.00"
- swipe:
    start: "50%,80%"
    end: "50%,20%"
    duration: 700
- tapOn: "Add role"
- assertVisible: "Server"
- swipe:
    start: "50%,20%"
    end: "50%,80%"
    duration: 700
- swipe:
    start: "50%,20%"
    end: "50%,80%"
    duration: 700
- tapOn: "Employer name"
- eraseText
- inputText: "Regression Bistro Edited"
- tapOn: "Teal"
- tapOn: "Default hourly rate"
- eraseText
- inputText: "21.50"
- tapOn: "Deduction rate (%)"
- eraseText
- inputText: "10"
- tapOn: "Save employer"
- assertVisible: "Regression Bistro Edited"
- scrollUntilVisible:
    element:
      text: "Archive employer"
    visibilityPercentage: 20
- tapOn: "Archive employer"
- assertVisible: "Archive this employer?"
- tapOn: "Cancel"
- assertVisible: "Archive employer"
- tapOn: "Archive employer"
- tapOn: "Archive employer"
- assertVisible: "Unarchive employer"
- tapOn: "Unarchive employer"
- assertVisible: "Archive employer"
- takeScreenshot: employer-role-lifecycle
