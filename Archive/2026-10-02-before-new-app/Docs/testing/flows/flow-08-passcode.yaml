appId: com.defacto365.protip365
name: 08 Enable passcode 123456, relaunch, unlock
---
- launchApp
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "Passcode & biometrics"
- tapOn: "Passcode & biometrics"
- assertVisible: "New 6-digit passcode"
- tapOn: "New 6-digit passcode"
- eraseText
- inputText: "123456"
- tapOn: "Confirm passcode"
- eraseText
- inputText: "123456"
- tapOn: "I understand the reset warning"
- tapOn: "Enable passcode"
# Success state shows the recovery key + Disable passcode
- assertVisible: "Disable passcode"
- takeScreenshot: passcode-set
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Unlock"
    timeout: 15000
- takeScreenshot: passcode-lock-screen
- tapOn:
    below: "6-digit passcode"
- inputText: "123456"
- tapOn: "Unlock"
- extendedWaitUntil:
    visible: "Schedule"
    timeout: 10000
- takeScreenshot: passcode-unlocked
