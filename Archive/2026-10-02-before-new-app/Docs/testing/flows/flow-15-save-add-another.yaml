appId: com.defacto365.protip365
name: 15 Save and add another creates exactly one shift
---
- launchApp
- runFlow:
    when:
      visible: "Unlock"
    commands:
      - tapOn: "6-digit passcode"
      - inputText: "123456"
      - tapOn: "Unlock"
- tapOn: "Schedule"
- tapOn: "Add shift"
- tapOn: "Regression Bar"
- tapOn: '.*Bartender.*24\.00.*'
- scrollUntilVisible:
    element:
      text: "Save & add another"
- tapOn: "Save & add another"
- assertVisible: "Add shift"
- tapOn: "Navigate up"
- assertVisible: ".*Regression Bar.*17:00–23:00.*"
- takeScreenshot: save-add-another-pass
